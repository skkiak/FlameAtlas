<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FlameAtlas · NASA Space Apps 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0B0B;--surface:#131313;--ink:#F3F1EC;--ink2:#A3A09A;--ink3:#6F6C66;--line:#262626;--accent:#FF6B1A;--accentInk:#0B0B0B;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#F6F4F0;--surface:#FFFFFF;--ink:#0E0E0E;--ink2:#58554F;--ink3:#8D8A83;--line:#DEDBD4;--accent:#E8530E;--accentInk:#FFFFFF;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 Inter,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:2px;background:linear-gradient(90deg,var(--accent),transparent 55%);z-index:5}
::selection{background:var(--accent);color:var(--accentInk)}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px}
header{display:flex;justify-content:space-between;align-items:center;padding:26px 0 22px;border-bottom:1px solid var(--line)}
.brand{font-weight:600;font-size:18px;letter-spacing:-.02em;display:flex;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);margin-right:10px}
.right{display:flex;gap:18px;align-items:center}
.demo{color:var(--ink3);font-size:13px;max-width:360px;text-align:right}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button,.th{font:inherit;font-size:13px;color:var(--ink2);background:none;border:0;padding:6px 11px;cursor:pointer;transition:all .2s}
.seg button.on{background:var(--accent);color:var(--accentInk);font-weight:500}
.th{border:1px solid var(--line);border-radius:6px}
.th:hover,.seg button:not(.on):hover{color:var(--ink)}
.layout{display:grid;grid-template-columns:300px 1fr;gap:64px;padding:44px 0 90px}
aside{position:sticky;top:24px;align-self:start}
h2.t,aside h2{font-size:13px;font-weight:500;color:var(--ink3);margin:0 0 18px;display:flex;align-items:center;gap:10px}
h2.t::before,aside h2::before{content:"";width:18px;height:1px;background:var(--accent)}
.presets{display:flex;gap:8px;margin-bottom:30px}
.presets button{flex:1;font:inherit;font-size:13px;padding:9px 0;background:var(--surface);color:var(--ink2);border:1px solid var(--line);border-radius:6px;cursor:pointer;transition:all .2s}
.presets button:hover{color:var(--ink);border-color:var(--ink3)}
.presets button.on{background:var(--accent);color:var(--accentInk);border-color:var(--accent)}
.ctl{margin-bottom:26px}
.ctl label{display:flex;justify-content:space-between;font-size:14px;margin-bottom:10px}
.ctl output{font-weight:500;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:1px;background:var(--ink3);outline:none;margin:8px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--accent);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--accent);cursor:pointer}
input[type=range]::-moz-range-thumb{width:9px;height:9px;border-radius:50%;background:var(--accent);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--accent);cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
select{width:100%;font:inherit;font-size:14px;padding:10px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px}
.note{margin-top:30px;font-size:12px;color:var(--ink3);line-height:1.55;border-top:1px solid var(--line);padding-top:14px}
.hero{padding:6px 0 40px;border-bottom:1px solid var(--line);background:radial-gradient(640px 260px at 88% 0,color-mix(in srgb,var(--accent) 13%,transparent),transparent)}
.k{font-size:13px;color:var(--ink3);margin-bottom:12px}
.hero h1{font-size:clamp(48px,8vw,108px);line-height:.96;letter-spacing:-.045em;font-weight:600;margin:0 0 34px;transition:color .3s}
.scale{position:relative;height:1px;background:var(--line);max-width:560px}
.scale i{position:absolute;top:-6px;width:2px;height:13px;background:var(--accent);transition:left .35s}
.scale-l{display:flex;justify-content:space-between;max-width:560px;font-size:12px;color:var(--ink3);margin-top:10px}
.stats{display:flex;gap:44px;margin:34px 0 0;flex-wrap:wrap}
.st b{display:block;font-size:34px;font-weight:500;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.st b small{font-size:14px;font-weight:400;color:var(--ink3);letter-spacing:0}
.st span{font-size:12px;color:var(--ink3)}
.hero p{max-width:62ch;color:var(--ink2);margin:28px 0 0}
.cite{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap;transition:color .2s}
.cite:hover{color:var(--accent)}
.sec{padding:40px 0;border-bottom:1px solid var(--line)}
svg{width:100%;height:auto;display:block;overflow:visible}
svg text{font-family:Inter,"Helvetica Neue",Arial,sans-serif;font-size:11px;fill:var(--ink3)}
.lg{display:flex;gap:22px;flex-wrap:wrap;font-size:12px;color:var(--ink3);margin-top:14px}
.lg span{display:flex;align-items:center;gap:8px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;border:1px solid var(--ink3)}
.lg i.on{background:var(--accent);border-color:var(--accent)}.lg i.ln{width:18px;height:0;border:0;border-top:1px dashed var(--accent);border-radius:0}
ol.exp{list-style:none;margin:0;padding:0}
ol.exp li{display:grid;grid-template-columns:28px 1.3fr 2fr 100px;gap:22px;align-items:baseline;padding:20px 22px;margin-bottom:10px;background:var(--surface);border:1px solid var(--line);border-radius:6px;transition:border-color .2s,transform .2s;animation:up .4s both}
ol.exp li:hover{border-color:var(--accent);transform:translateY(-1px)}
ol.exp li:first-child{border-left:2px solid var(--accent)}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.rk{color:var(--ink3);font-variant-numeric:tabular-nums}li:first-child .rk{color:var(--accent)}
.nm b{font-weight:500;display:block}.nm span{color:var(--ink2);font-size:13px;display:block}.nm .cite{display:inline-block;margin-top:8px;font-size:12px}
.pr{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;font-size:13px;font-variant-numeric:tabular-nums}
.pr span{display:block;color:var(--ink3);font-size:12px}
.sim b{font-weight:500;font-size:18px;font-variant-numeric:tabular-nums}
.bar{height:2px;background:var(--line);margin-top:8px}.bar i{display:block;height:100%;background:var(--accent);transition:width .35s}
.chat{max-width:700px}
.msgs{display:flex;flex-direction:column;gap:14px;margin-bottom:18px}
.m{font-size:14px;max-width:60ch;color:var(--ink)}.m.u{align-self:flex-end;color:var(--ink2);text-align:right}
.chat form{display:flex;gap:10px;border-bottom:1px solid var(--ink3);padding-bottom:8px}
.chat input[type=text]{flex:1;font:inherit;background:none;border:0;color:var(--ink);padding:6px 0}
.chat input[type=text]::placeholder{color:var(--ink3)}
.chat button{font:inherit;font-size:14px;background:none;border:0;color:var(--accent);cursor:pointer;font-weight:500}
.ab{max-width:64ch;color:var(--ink2);margin:0 0 12px}
@media (max-width:900px){.layout{grid-template-columns:1fr;gap:36px}aside{position:static}.wrap{padding:0 20px}header{flex-wrap:wrap;gap:12px}.demo{display:none}ol.exp li{grid-template-columns:24px 1fr 80px}.pr{grid-column:2/4;grid-row:2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header><span class="brand"><i class="dot"></i>FlameAtlas</span><span class="right"><span class="demo" id="dm"></span><div class="seg" role="group" aria-label="Language"><button type="button" data-l="ru">RU</button><button type="button" data-l="en">EN</button></div><button id="th" class="th" type="button"></button></span></header>
<div class="layout">
<aside>
  <h2 data-i="mission"></h2>
  <div class="presets" id="presets"></div>
  <div class="ctl"><label for="p"><span data-i="pressure"></span><output id="op"></output></label><input id="p" type="range" min="20" max="110" step="0.5"></div>
  <div class="ctl"><label for="o"><span data-i="oxygen"></span><output id="oo"></output></label><input id="o" type="range" min="15" max="40" step="0.5"></div>
  <div class="ctl"><label for="f"><span data-i="flow"></span><output id="of"></output></label><input id="f" type="range" min="0" max="40" step="1"></div>
  <div class="ctl"><label for="m"><span data-i="fuel"></span></label>
    <select id="m"><option value="" data-i="any"></option><option value="solid" data-i="solid"></option><option value="liquid" data-i="liquid"></option><option value="gas" data-i="gas"></option></select></div>
  <p class="note" data-i="note"></p>
</aside>
<main>
  <section class="hero">
    <div class="k" data-i="heroK"></div>
    <h1 id="risk"></h1>
    <div class="scale"><i id="mark"></i></div>
    <div class="scale-l"><span data-i="sLow"></span><span data-i="sMid"></span><span data-i="sHigh"></span></div>
    <div class="stats"><div class="st"><b id="sp"></b><span data-i="pressure"></span></div><div class="st"><b id="so"></b><span data-i="oxygen"></span></div><div class="st"><b id="sf"></b><span data-i="flow"></span></div></div>
    <p id="insight"></p>
  </section>
  <section class="sec"><h2 class="t" data-i="hChart"></h2><div id="chart"></div><div class="lg" id="lg"></div></section>
  <section class="sec"><h2 class="t" data-i="hSim"></h2><ol class="exp" id="list"></ol></section>
  <section class="sec chat"><h2 class="t" data-i="hChat"></h2>
    <div class="msgs" id="msgs"><div class="m" id="intro"></div></div>
    <form id="cf"><input id="ci" type="text" autocomplete="off"><button type="submit" data-i="ask"></button></form>
  </section>
  <section class="sec" id="about"><h2 class="t" data-i="hAbout"></h2><p class="ab" data-i="a1"></p><p class="ab" data-i="a2"></p><p class="ab" data-i="a3"></p></section>
</main>
</div></div>
<script>
let EXP=[{"id":"19930011018-1","name":"Forced concurrent-flow flame spread, 5-s drop tower (27 tests)","pl":"NASA Lewis 5-second drop tower","mat":"thin tissue paper (Kimwipe)","ph":"solid","p":101.3,"o":30.0,"f":5.0,"r":null,"out":"Flames grew at higher O2 and flow velocities and shrank at lower ones. Final fate (quenching or near-steady) was not determined in 5 s.","kf":"Flow varied from <1 to 5 cm/s and O2 from 30% down to extinction (the values given are the upper ends of the ranges). Flame base spread rates were similar to the model, but the 5 s test time was too short for steady flames.","source_url":"https://ntrs.nasa.gov/citations/19930011018"},{"id":"19930011018-2","name":"Fig. 6 flame shape comparison, 5 cm/s concurrent flow, 15% O2","pl":"NASA Lewis 5-second drop tower","mat":"thin tissue paper (Kimwipe)","ph":"solid","p":101.3,"o":15.0,"f":5.0,"r":null,"out":"flame observed; shape matches computed reaction contours","kf":"The 15% O2 flame shape agrees well with the computed reaction contours for the same conditions.","source_url":"https://ntrs.nasa.gov/citations/19930011018"},{"id":"19930011018-5","name":"Downward (opposed buoyant flow) flame spread, 18% O2","pl":"NASA KC-135 aircraft (parabolic flights)","mat":"thin tissue paper (Kimwipe)","ph":"solid","p":101.3,"o":18.0,"f":null,"r":null,"out":"steady propagation","kf":"Spread rate decreases with increasing acceleration; the difference between 1/10 g and 1/6 g is small.","source_url":"https://ntrs.nasa.gov/citations/19930011018"},{"id":"19930011018-6","name":"Downward (opposed buoyant flow) flame spread, 16% O2","pl":"NASA KC-135 aircraft (parabolic flights)","mat":"thin tissue paper (Kimwipe)","ph":"solid","p":101.3,"o":16.0,"f":null,"r":null,"out":"steady propagation","kf":"Spread rate decreases with increasing acceleration; the difference between 1/10 g and 1/6 g is small.","source_url":"https://ntrs.nasa.gov/citations/19930011018"},{"id":"19930011018-7","name":"Downward (opposed buoyant flow) flame spread, 15% O2","pl":"NASA KC-135 aircraft (parabolic flights)","mat":"thin tissue paper (Kimwipe)","ph":"solid","p":101.3,"o":15.0,"f":null,"r":null,"out":"steady propagation","kf":"Spread rate decreases with increasing acceleration. Schlieren images at 15% O2 were taken at two reduced-gravity levels (Fig. 7, 1 atm).","source_url":"https://ntrs.nasa.gov/citations/19930011018"},{"id":"19930011018-8","name":"Downward flame spread, 14% O2, 1/10 g","pl":"NASA KC-135 aircraft (parabolic flights)","mat":"thin tissue paper (Kimwipe)","ph":"solid","p":101.3,"o":14.0,"f":null,"r":null,"out":"flame propagation at 1/10 g","kf":"Flames at higher acceleration levels and 14% O2 did not survive the ignition transient.","source_url":"https://ntrs.nasa.gov/citations/19930011018"},{"id":"19930011018-10","name":"Upward (concurrent buoyant) flame spread, 12% O2, 1/6 g and 1/3 g","pl":"NASA KC-135 aircraft (parabolic flights)","mat":"thin tissue paper (Kimwipe)","ph":"solid","p":101.3,"o":12.0,"f":null,"r":null,"out":"flame propagation down to 12% O2","kf":"At normal pressure the upward flames had thermal plumes that became unsteady downstream; the fuel curled and disturbed the bottom of the flame.","source_url":"https://ntrs.nasa.gov/citations/19930011018"},{"id":"19930011018-11","name":"Upward flame spread, 12% O2, 1/10 g (single test)","pl":"NASA KC-135 aircraft (parabolic flights)","mat":"thin tissue paper (Kimwipe)","ph":"solid","p":101.3,"o":12.0,"f":null,"r":null,"out":"no propagating flame","kf":"A single test at 1/10 g gave no propagation at 12% O2.","source_url":"https://ntrs.nasa.gov/citations/19930011018"},{"id":"19930011018-13","name":"Upward flame spread, 15% O2, 1 atm, 1/6 g","pl":"NASA KC-135 aircraft (parabolic flights)","mat":"thin tissue paper (Kimwipe)","ph":"solid","p":101.3,"o":15.0,"f":null,"r":null,"out":"upward-propagating flame; unsteady plume, bottom of flame stabilized near the lowest point on the fuel","kf":"The plume was unsteady, while the flame base was stabilized near the lowest point on the fuel surface.","source_url":"https://ntrs.nasa.gov/citations/19930011018"},{"id":"19930011018-14","name":"Upward flame spread, 15% O2, 0.5 atm, 1/6 g","pl":"NASA KC-135 aircraft (parabolic flights)","mat":"thin tissue paper (Kimwipe)","ph":"solid","p":50.7,"o":15.0,"f":null,"r":null,"out":"propagating flame with a more laminar plume","kf":"At reduced pressure the plumes were more laminar and the fuel deformed more slowly. Low-pressure limits exist but were not determined precisely.","source_url":"https://ntrs.nasa.gov/citations/19930011018"},{"id":"20140006750-15","name":"R377 n-decane, 21% O2/79% N2, 0.5 atm","pl":"ISS, MDCA in CIR (FLEX)","mat":"n-decane droplet (D0=4.03 mm)","ph":"liquid","p":50.7,"o":21.0,"f":null,"r":null,"out":"hot flame extinguished by radiative extinction at ~14.6 s, then quasi-steady cool-flame burning, then cool-flame extinction and evaporation","kf":"Burning rate constants K: 0.41 mm2/s (hot flame) and 0.33 mm2/s (cool flame)","source_url":"https://ntrs.nasa.gov/citations/20140006750"},{"id":"20140006750-16","name":"R374 n-decane, 25% O2/75% N2, 0.5 atm","pl":"ISS, MDCA in CIR (FLEX)","mat":"n-decane droplet (D0=3.79 mm)","ph":"liquid","p":50.7,"o":25.0,"f":null,"r":null,"out":"no radiative extinction; visible flame ended with droplet micro-explosion 26 s after ignition","kf":"K = 0.52 mm2/s while the droplet stayed in the field of view; radiative heat loss higher than at 21% O2","source_url":"https://ntrs.nasa.gov/citations/20140006750"},{"id":"20140006750-17","name":"R379 n-decane, 17% O2/83% N2, 0.5 atm","pl":"ISS, MDCA in CIR (FLEX)","mat":"n-decane droplet (D0=3.86 mm)","ph":"liquid","p":50.7,"o":17.0,"f":null,"r":null,"out":"radiative extinction at ~7 s followed by cool-flame burning and extinction","kf":"K = 0.31 mm2/s (first stage) and 0.27 mm2/s (second stage); lower O2 gives lower radiative loss","source_url":"https://ntrs.nasa.gov/citations/20140006750"},{"id":"20140006750-18","name":"R3 -suppression-of-solids-bass.pdf?emrc=3a5c2c"},{"id":"GELsymposiumfinalRev-101","name":"GEL Case 1 (1409B) – низкоскоростное гашение (quenching)","pl":"МКС, SoFIE/GEL, Combustion Integrated Rig (CIR)","mat":"PMMA, сфера диаметром 4 см","ph":"solid","p":105.4,"o":14.21,"f":4.83,"r":null,"out":"гашение (quenching): кончик пламени сжимается вверх по потоку, перед затуханием около 10 циклов пульсаций","kf":"Гашение при малой скорости потока идёт через пульсации кончика пламени вниз по потоку, на каждом цикле пламя становится короче; потухание при 14,21% O2, фактически поток 4,46–4,92 см/с","source_url":"https://ntrs.nasa.gov/api/citations/20240007628/downloads/GELsymposiumfinalRev1.pdf"},{"id":"GELsymposiumfinalRev-102","name":"GEL Case 2 (1408A) – отрыв пламени (blowoff)","pl":"МКС, SoFIE/GEL, Combustion Integrated Rig (CIR)","mat":"PMMA, сфера диаметром 4 см","ph":"solid","p":107.4,"o":14.99,"f":34.28,"r":null,"out":"отрыв пламени (blowoff): отверстие в пламени в точке торможения, затем два цикла пульсации основания и вращение у плеча сферы","kf":"Локальный отрыв пламени при O2 ниже предела 14,99% для скорости деформации 25,7 1/с; два цикла пульсации основания пламени, затем азимутальное вращение 3,18 с","source_url":"https://ntrs.nasa.gov/api/citations/20240007628/downloads/GELsymposiumfinalRev1.pdf"},{"id":"GELsymposiumfinalRev-103","name":"GEL Case 3 (1402C) – гашение при промежуточной скорости потока","pl":"МКС, SoFIE/GEL, Combustion Integrated Rig (CIR)","mat":"PMMA, сфера диаметром 4 см","ph":"solid","p":108.4,"o":13.54,"f":11.5,"r":null,"out":"промежуточное потухание: пламя сжимается без пульсаций и гаснет за один кадр видео","kf":"При промежуточных скоростях (9,22–11,5 см/с) переход от гашения к отрыву плавный, пульсаций нет; предельная концентрация O2 наименьшая (13,54%)","source_url":"https://ntrs.nasa.gov/api/citations/20240007628/downloads/GELsymposiumfinalRev1.pdf"},{"id":"GELsymposiumfinalRev-104","name":"GEL Case 4 (1409C) – самоподдерживающиеся пульсации при сверхмалой скорости потока","pl":"МКС, SoFIE/GEL, Combustion Integrated Rig (CIR)","mat":"PMMA, сфера диаметром 4 см","ph":"solid","p":104.4,"o":20.77,"f":0.44,"r":250.0,"out":"гашение (quenching) после длительных циклических пульсаций кончика пламени, около 927 с","kf":"Пульсации начались при 26,25% O2 и шли до гашения при 20,77% O2 (поток 0,2–0,4 см/с); частота 1,4→1→0,8 Гц; пиковая скорость пульсации кончика около 25 см/с (приведено в spread_rate_mm_s)","source_url":"https://ntrs.nasa.gov/api/citations/20240007628/downloads/GELsymposiumfinalRev1.pdf"},{"id":"GELsymposiumfinalRev-105","name":"GEL Case 5 (1410C) – отрыв пламени и вращающиеся фрагменты пламени","pl":"МКС, SoFIE/GEL, Combustion Integrated Rig (CIR)","mat":"PMMA, сфера диаметром 4 см","ph":"solid","p":108.4,"o":14.37,"f":49.68,"r":null,"out":"отрыв пламени в точке торможения, стабилизация у плеча сферы около 40 с, затем вращающиеся фрагменты пламени и потухание","kf":"Пламя, стабилизированное сбоку, держалось 40 с, из них около 35 с вращалось; фрагменты пламени вращались с частотой 2–3,5 Гц по мере снижения O2 (14,37→13,89%)","source_url":"https://ntrs.nasa.gov/api/citations/20240007628/downloads/GELsymposiumfinalRev1.pdf"},{"id":"ICES 2021-266 0503-2-106","name":"Saffire IV-1","pl":"Cygnus NG-13, Saffire IV (орбитальный эксперимент)","mat":"SIBAL fabric (75% хлопок / 25% стекловолокно), длина 50 см","ph":"solid","p":100.0,"o":22.0,"f":20.0,"r":null,"out":"Сонаправленное горение тонкой ткани, пламя достигло предельного размера: установившийся 8,5 см, максимальный 11,0 см","kf":"В канале меньшей высоты (30 см) скорость распространения пламени примерно на 100% выше, чем в Saffire I и III, а размер пламени больше","source_url":"https://ntrs.nasa.gov/api/citations/20210011521/downloads/ICES%202021-266%200503-2021%20final.pdf"},{"id":"ICES 2021-266 0503-2-107","name":"Saffire IV-2","pl":"Cygnus NG-13, Saffire IV (орбитальный эксперимент)","mat":"PMMA двусторонний, толщина 10 мм, длина 18 см","ph":"so olid","p":72.6,"o":25.7,"f":20.0,"r":null,"out":"Встречное распространение пламени по ребрам; дефлагация при начальном воспламенении; быстрое тушение после 300 с при потоке 5 см/с; скорость распространения убывала с ростом ширины ребра","kf":"Определяющим размером для распространения пламени была ширина ребра, а не толщина образца; пламя быстрее шло по тонким ребрам","source_url":"https://ntrs.nasa.gov/api/citations/20210011521/downloads/ICES%202021-266%200503-2021%20final.pdf"},{"id":"ICES 2021-266 0503-2-111","name":"Saffire I-1","pl":"Saffire I (орбитальный эксперимент, Cygnus)","mat":"SIBAL fabric, 41 см шириной, длина 94 см","ph":"solid","p":100.0,"o":21.0,"f":20.0,"r":null,"out":"Установившийся размер пламени 4 см, максимальный 6,2 см (канал высотой 46 см)","kf":"Наблюдался выброс размера пламени около 30% из-за развития пограничного слоя на поверхности образца","source_url":"https://ntrs.nasa.gov/api/citations/20210011521/downloads/ICES%202021-266%200503-2021%20final.pdf"},{"id":"ICES 2021-266 0503-2-112","name":"Saffire II-5","pl":"Saffire II (орбитальный эксперимент, Cygnus)","mat":"SIBAL fabric, ширина 5 см, длина 30 см","ph":"solid","p":100.0,"o":21.0,"f":20.0,"r":null,"out":"Установившийся и максимальный размер пламени 4 см (канал 46 см)","kf":"Выброса размера пламени не наблюдалось, так как образец расположен с длинным участком входа","source_url":"https://ntrs.nasa.gov/api/citations/20210011521/downloads/ICES%202021-266%200503-2021%20final.pdf"},{"id":"ICES 2021-266 0503-2-113","name":"Saffire II-6","pl":"Saffire II (орбитальный эксперимент, Cygnus)","mat":"SIBAL fabric, ширина 5 см, длина 30 см","ph":"solid","p":100.0,"o":21.0,"f":25.0,"r":null,"out":"Установившийся и максимальный размер пламени 5 см (канал 46 см)","kf":"Выброса размера пламени не наблюдалось, так как образец расположен с длинным участком входа","source_url":"https://ntrs.nasa.gov/api/citations/20210011521/downloads/ICES%202021-266%200503-2021%20final.pdf"},{"id":"ICES 2021-266 0503-2 function chart(ids){
  const W=720,H=300,L0=44,B=34,T=16,R=14,x=p=>L0+(clamp(p,20,110)-20)/90*(W-L0-R),y=o=>H-B-(clamp(o,10,40)-10)/30*(H-B-T);
  const jit=id=>String(id).split("").reduce((a,c)=>a+c.charCodeAt(0),0)%9-4;
  let s="<svg viewBox='0 0 "+W+" "+H+"' role='img' aria-label='"+esc(t("hChart"))+"'>";
  [10,15,20,25,30,35,40].forEach(o=>s+="<line x1='"+L0+"' x2='"+(W-R)+"' y1='"+y(o)+"' y2='"+y(o)+"' stroke='var(--line)'/><text x='"+(L0-8)+"' y='"+(y(o)+4)+"' text-anchor='end'>"+o+" %</text>");
  [20,40,60,80,100].forEach(p=>s+="<text x='"+x(p)+"' y='"+(H-14)+"' text-anchor='middle'>"+p+"</text>");
  s+="<text x='"+(W-R)+"' y='"+(H-1)+"' text-anchor='end'>"+t("axisP")+"</text><text x='"+L0+"' y='"+(T-5)+"'>O₂, %</text>";
  s+="<line x1='"+x(S.p)+"' x2='"+x(S.p)+"' y1='"+T+"' y2='"+(H-B)+"' stroke='var(--accent)' stroke-dasharray='3 4'/><line x1='"+L0+"' x2='"+(W-R)+"' y1='"+y(S.o)+"' y2='"+y(S.o)+"' stroke='var(--accent)' stroke-dasharray='3 4'/>";
  EXP.filter(e=>(!S.m||e.ph===S.m)&&e.p!=null&&e.o!=null).forEach(e=>{const on=ids.includes(e.id);
    s+="<circle cx='"+(x(e.p)+jit(e.id))+"' cy='"+(y(e.o)+jit(e.id+"y"))+"' r='"+(on?5.5:3.5)+"' fill='"+(on?"var(--accent)":"none")+"' stroke='"+(on?"var(--accent)":"var(--ink3)")+"' stroke-width='1'><title>"+esc(e.name||e.id)+"</title></circle>"});
  $("chart").innerHTML=s+"</svg>";
}
function setPre(k){S.pre=k;[S.p,S.o,S.f]=PRE[k];$("p").value=S.p;$("o").value=S.o;$("f").value=S.f;render()}
function local(q){
  const m=q.match(/(\d+(?:[.,]\d+)?)\s*%/),o=m?parseFloat(m[1].replace(",",".")):S.o;
  const rows=EXP.filter(e=>e.o!=null).sort((x,y)=>Math.abs(x.o-o)-Math.abs(y.o-o)).slice(0,3);
  if(!rows.length)return t("nodata");
  return t("noai",{o})+rows.map((e,i)=>short(e.name||e.id,60)+": "+v(e.o,"pct")+", "+v(e.p,"kpa")+", "+short(txt(e),110)+" ["+(i+1)+"]").join("; ")+".";
}
function setLang(l){lang=l;try{localStorage.setItem("fa-lang",l)}catch(_){}
  document.documentElement.lang=l;
  document.querySelectorAll("[data-i]").forEach(el=>el.textContent=t(el.dataset.i));
  document.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("on",b.dataset.l===l));
  $("ci").placeholder=t("ph");$("intro").textContent=t("intro");$("dm").textContent=t("dm");
  $("presets").innerHTML=Object.keys(PRE).map(k=>"<button type='button' data-k='"+k+"'>"+t("p_"+k)+"</button>").join("");
  $("lg").innerHTML="<span><i class='ln'></i>"+t("lgYou")+"</span><span><i class='on'></i>"+t("lgTop")+"</span><span><i></i>"+t("lgOth")+"</span>";
  setTh(th);render()}
document.querySelector(".seg").onclick=e=>{if(e.target.dataset.l)setLang(e.target.dataset.l)};
$("th").onclick=()=>setTh(th==="dark"?"light":"dark");
$("presets").onclick=e=>{if(e.target.dataset.k)setPre(e.target.dataset.k)};
["p","o","f"].forEach(k=>$(k).oninput=e=>{S[k]=+e.target.value;S.pre="";render()});
$("m").onchange=e=>{S.m=e.target.value;render()};
$("cf").onsubmit=async e=>{e.preventDefault();const q=$("ci").value.trim();if(!q)return;
  $("msgs").insertAdjacentHTML("beforeend","<div class='m u'></div><div class='m'>…</div>");
  const n=$("msgs").children,a=n[n.length-1];n[n.length-2].textContent=q;$("ci").value="";
  let r0=null;
  try{const c=new AbortController();setTimeout(()=>c.abort(),20000);
    const r=await fetch(API+"/api/chat",{method:"POST",signal:c.signal,headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q,p:S.p,o2:S.o,flow:S.f,phase:S.m})});
    if(r.ok)r0=(await r.json()).answer}catch(_){}
  a.textContent=r0||local(q)};
fetch("/api/experiments").then(r=>r.json()).then(d=>{if(Array.isArray(d)&&d.length)EXP=d}).catch(()=>{}).finally(()=>{setLang(lang);setPre("iss")});
</script>
</body>
